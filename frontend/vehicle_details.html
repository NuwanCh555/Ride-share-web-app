<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vehicle Details - FLYME</title>
  <meta name="description" content="View driver vehicle details on FLYME.">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
  <header>
    <div class="navbar">
      <a href="index.php" class="logo-container">
        <img src="New folder/julm.jpg" alt="FLYME Logo" class="logo-img">
        <div class="logo">FLYME</div>
      </a>
      <nav>
        <ul>
          <li><a href="index.php">Home</a></li>
          <li><a href="index.php#vehicles">Vehicles</a></li>
          <li><a href="login.html">Login / Signup</a></li>
        </ul>
      </nav>
      <i class='bx bx-menu menu-icon'></i>
    </div>
  </header>

  <main>
    <!-- Uses the same .vehicle-details grid defined in style.css -->
    <div class="vehicle-details" id="detailContent">

      <!-- Left: image column — populated by JS -->
      <div class="vehicle-image" id="vehicleImageCol">
        <img src="New folder/car.jpg" alt="Loading…" id="vehicleImg">
      </div>

      <!-- Right: info column — populated by JS -->
      <div class="vehicle-info" id="vehicleInfoCol">
        <h2 id="vehicleTitle">Loading…</h2>
        <div class="price" id="vehicleSubtitle">&nbsp;</div>
        <p id="vehicleDesc">Please wait while we load this vehicle's details.</p>

        <div class="form-container" style="padding: 1.5rem; margin: 0; max-width: 100%;">
          <h3 style="margin-bottom: 1rem; color: var(--primary-color);">Book this Vehicle</h3>
          <form id="bookingForm">
            <div class="form-group">
              <label for="pickup">Pickup Location</label>
              <input type="text" id="pickup" name="pickup" required>
            </div>
            <div class="form-group">
              <label for="date">Rental Date</label>
              <input type="date" id="date" name="date" required>
            </div>
            <button type="submit" class="btn">Confirm Booking</button>
          </form>
        </div>
      </div>

    </div>
  </main>

  <script src="js/project.js"></script>
  <script>
    (function () {
      const PLACEHOLDER = 'New folder/car.jpg';

      const params = new URLSearchParams(window.location.search);
      const id     = parseInt(params.get('id'), 10);

      if (!id || id < 1) {
        document.getElementById('vehicleTitle').textContent  = 'Vehicle not found.';
        document.getElementById('vehicleDesc').textContent   = 'No vehicle ID was provided in the URL.';
        return;
      }

      fetch('../backend/vehicles_api.php?id=' + id)
        .then(res => res.json())
        .then(data => {
          if (!data.success || !data.vehicle) {
            document.getElementById('vehicleTitle').textContent = 'Vehicle not found.';
            document.getElementById('vehicleDesc').textContent  = 'This vehicle could not be loaded.';
            return;
          }

          const v = data.vehicle;

          // ── Safely populate all fields via textContent (XSS-safe) ────────────
          const img = document.getElementById('vehicleImg');
          img.src   = v.vehicle_image ? '../backend/' + v.vehicle_image : PLACEHOLDER;
          img.onerror = () => { img.src = PLACEHOLDER; };
          img.alt   = v.vehicle_type || 'Vehicle';

          // Update page title
          document.title = (v.vehicle_type || 'Vehicle') + ' - FLYME';

          document.getElementById('vehicleTitle').textContent   = v.vehicle_type   || 'Vehicle';
          document.getElementById('vehicleSubtitle').textContent = 'Driver: ' + (v.driver_name || 'Unknown');

          // Build the description line with plate + capacity
          const plate = v.plate_number || '—';
          const cap   = v.capacity     ? v.capacity + ' passengers' : '—';
          document.getElementById('vehicleDesc').textContent =
            'Plate No: ' + plate + '   |   Capacity: ' + cap;
        })
        .catch(() => {
          document.getElementById('vehicleTitle').textContent = 'Error loading vehicle.';
          document.getElementById('vehicleDesc').textContent  = 'Could not reach the server. Please try again.';
        });
    })();
  </script>
</body>
</html>
