<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up - FLYME</title>
  <meta name="description" content="Register an account for FLYME vehicle rental service.">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
  <header>
    <div class="navbar">
      <a href="index.html" class="logo-container">
        <img src="New folder/julm.jpg" alt="FLYME Logo" class="logo-img">
        <div class="logo">FLYME</div>
      </a>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="index.html#vehicles">Vehicles</a></li>
        </ul>
      </nav>
      <i class='bx bx-menu menu-icon'></i>
    </div>
  </header>

  <main style="display: flex; align-items: center; justify-content: center;">
    <div class="form-container">
      <h1>Create an Account</h1>
      <form id="registerForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required placeholder="Enter a username">
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="Enter your email">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="Create a password">
        </div>
        <div class="form-group">
          <label>Role</label>
          <div style="display: flex; gap: 15px; margin-top: 5px;">
            <label><input type="radio" name="user_type" value="passenger" checked> Passenger</label>
            <label><input type="radio" name="user_type" value="driver"> Driver</label>
          </div>
        </div>
        <button type="submit" class="btn" style="width: 100%; justify-content: center;">Register <i class='bx bx-user-plus'></i></button>
        <div class="form-links">
          <p>Already have an account? <a href="login.html">Login here</a></p>
        </div>
      </form>
    </div>
  </main>
  
  <script src="js/project.js"></script>
</body>
</html>
