<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment - FLYME</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .payment-container {
      max-width: 500px;
      margin: 100px auto;
      background: rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 10px;
      backdrop-filter: blur(10px);
      text-align: center;
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .payment-container h2 {
      margin-bottom: 20px;
      color: #00d2ff;
    }
    .payment-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .payment-form input {
      padding: 15px;
      border-radius: 5px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(0,0,0,0.5);
      color: #fff;
      font-size: 1rem;
    }
    .pay-btn {
      background: #00d2ff;
      color: #000;
      padding: 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1.1rem;
      transition: 0.3s;
    }
    .pay-btn:hover {
      background: #3a7bd5;
      color: #fff;
    }
    .result-details {
      margin-top: 20px;
      padding: 15px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 5px;
      text-align: left;
    }
    .result-details p {
      margin-bottom: 5px;
    }
  </style>
</head>
<body>
  <div class="payment-container">
    <h2><i class='bx bx-credit-card'></i> Complete Payment</h2>
    <form class="payment-form" id="paymentForm">
      <input type="number" id="tripId" name="trip_id" placeholder="Enter Trip ID" required>
      <input type="number" id="amount" name="amount" placeholder="Total Fare Amount ($)" step="0.01" required>
      <button type="submit" class="pay-btn">Pay Securely</button>
    </form>
    <div id="paymentResult"></div>
  </div>
  
  <script>
    document.getElementById('paymentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const btn = e.target.querySelector('.pay-btn');
      btn.innerText = 'Processing...';
      
      try {
        const res = await fetch('../backend/payment.php', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        
        const resultDiv = document.getElementById('paymentResult');
        if (data.status === 'success') {
          resultDiv.innerHTML = `
            <div class="result-details" style="border-left: 4px solid #00d2ff;">
              <h3 style="color: #00d2ff; margin-bottom: 10px;">Payment Successful!</h3>
              <p>Total Fare Paid: <strong>$${data.data.amount}</strong></p>
              <p>Platform Commission (15%): <strong>$${data.data.platform_fee}</strong></p>
              <p>Driver Net Earnings (85%): <strong>$${data.data.net_earnings}</strong></p>
            </div>
          `;
          e.target.reset();
        } else {
          resultDiv.innerHTML = `<p style="color: #ff4757; margin-top: 15px;">Error: ${data.message}</p>`;
        }
      } catch (err) {
        console.error(err);
      } finally {
        btn.innerText = 'Pay Securely';
      }
    });
  </script>
</body>
</html>
